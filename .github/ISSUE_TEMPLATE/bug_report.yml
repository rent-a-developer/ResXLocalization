name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: >
        Which package is affected? ResXLocalization.Core is the shared engine both UI packages depend on;
        pick it when the problem shows in a lookup made from code rather than from markup. "Not sure" is a
        real answer and is fine.
      options:
        - ResXLocalization.Avalonia
        - ResXLocalization.WPF
        - ResXLocalization.Core
        - More than one, or not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: lookup-mode
    attributes:
      label: Lookup mode
      description: Which lookup path shows the problem (if applicable)?
      options:
        - Typed key ({l:Localize {x:Static …Keys.…}})
        - Scoped (Key + ResourceManager)
        - Search-all (key only)
        - Enum ({l:LocalizeEnum} / LocalizeEnumConverter)
        - Dynamic format arguments (LocalizeArgs.Arg0…Arg8)
        - Culture fallback / satellite discovery
        - Source generator / build
        - Other / not applicable
  - type: dropdown
    id: publish-mode
    attributes:
      label: How is the application published?
      description: >
        Trimming and Native AOT remove code the just-in-time compiler keeps, so a problem that appears only
        after publishing has a different cause from one that appears in a normal run. If you are not sure,
        "Ordinary build" is the answer.
      options:
        - Ordinary build or run (no trimming)
        - PublishTrimmed
        - PublishAot (Native AOT)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >
        The smallest thing that shows the problem: the .resx entry (and whether the translated file has it),
        the XAML or C# lookup, and the culture you switched to. A link to a minimal repository works too.
        Please cut it down - a reproduction that is already minimal is the difference between a fix this
        week and a fix eventually.
      render: text
    validations:
      required: true
  - type: textarea
    id: exception
    attributes:
      label: Exception, if any
      description: The full exception type, message and stack trace. Leave empty if nothing was thrown.
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      description: >
        The .NET version you run on, the UI framework version, and the operating system.
      placeholder: ".NET 10.0.x, Avalonia 12.1.0 / WPF, Windows 11 / Ubuntu 24.04, win-x64"
    validations:
      required: true
