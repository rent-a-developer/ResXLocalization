name: CI

on:
  pull_request:
    branches:
      - main
      - release/**
    # labeled and unlabeled re-run the checks when a maintainer adds or removes accept-allocation-increase,
    # which turns a failing allocation alert of the benchmark comparison into a passing one and back. They
    # re-run the whole workflow; the concurrency group below cancels the run in progress, and labeling is rare.
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  push:
    branches:
      - main
      - release/**
    # Version tags (v1.2.3) run the full pipeline and then publish the packages to NuGet.org.
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AOT_OUTPUT: artifacts/package-aot
  AVALONIA_CONSUMER_PROJECT: tests/package-consumption/AvaloniaConsumer/AvaloniaConsumer.csproj
  COMBINED_CONSUMER_PROJECT: tests/package-consumption/CombinedConsumer/CombinedConsumer.csproj
  BENCHMARK_DATA_BRANCH: benchmark-data
  BENCHMARK_REPORTS: artifacts/benchmarks
  CONFIGURATION: Release
  CONSUMER_DIRECTORY: tests/package-consumption
  DOCFX_CONFIG: build/docfx/docfx.json
  DOCS_SITE: artifacts/docs/site
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  MESSAGEFORMAT_CONSUMER_PROJECT: tests/package-consumption/MessageFormatConsumer/MessageFormatConsumer.csproj
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  NUGET_CONFIG: NuGet.config
  PACKAGE_OUTPUT: artifacts/packages
  RELEASE_NOTES_FILE: artifacts/release/release-notes.md
  RELEASE_NOTES_SCRIPT: scripts/extract-release-notes.ps1
  SOLUTION: ResXLocalization.slnx
  SOLUTION_FILTER_NON_WINDOWS: ResXLocalization.NonWindows.slnf
  TEST_RESULTS: artifacts/test-results
  WPF_CONSUMER_PROJECT: tests/package-consumption/WpfConsumer/WpfConsumer.csproj
  WPF_TEST_PROJECT: tests/ResXLocalization.WPF.Sample.Tests/ResXLocalization.WPF.Sample.Tests.csproj

jobs:
  # Enforce the hygiene and formatting the repository ships tooling for: a rule that is not enforced in
  # CI drifts with the first external pull request.
  #
  # Every substantive check here is a call to the script a developer runs, so the two cannot disagree.
  #
  # Ubuntu is a cost and speed choice, not a correctness one: the tidiness check gives the same answer on
  # every OS, and on Linux the non-Windows solution filter keeps the WPF projects out of the restore -
  # which the script reports rather than passing over in silence.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history, for the .git-blame-ignore-revs check below; at depth 1 no revision it names
          # would resolve.
          fetch-depth: 0

      # .gitattributes only applies when a file is ADDED. A file committed past it, or a rule added
      # after the file, stays wrong forever and nothing complains - and commits created server-side,
      # such as a bot's, bypass the filter entirely. The script asks the same question of both what git
      # stored and what is on disk, and says what fixes each.
      - name: Verify line endings
        run: pwsh -NoProfile -NonInteractive -File scripts/verify-line-endings.ps1

      # .git-blame-ignore-revs names commits by raw SHA, and git does NOT complain about one it cannot
      # resolve - it silently skips the entry. A rebase-merge or squash-merge rewrites every SHA on a
      # branch, which is exactly how that happens. This step is what makes it visible.
      - name: Verify .git-blame-ignore-revs
        run: |
          if [ ! -f .git-blame-ignore-revs ]; then
            echo "No .git-blame-ignore-revs - nothing to check."
            exit 0
          fi

          status=0
          count=0
          while read -r revision _ || [ -n "${revision}" ]; do
            revision="${revision%$'\r'}"
            case "${revision}" in ''|\#*) continue ;; esac
            count=$((count + 1))

            if ! git rev-parse --verify --quiet "${revision}^{commit}" > /dev/null; then
              echo "::error file=.git-blame-ignore-revs::${revision} is not a commit in this repository. If the branch that introduced it was rebased or squash-merged, replace it with the SHA it became."
              status=1
            elif ! git merge-base --is-ancestor "${revision}" HEAD; then
              echo "::error file=.git-blame-ignore-revs::${revision} is a commit, but not an ancestor of HEAD, so blame can never reach it."
              status=1
            fi
          done < .git-blame-ignore-revs

          if [ "${count}" -eq 0 ]; then
            echo "::error file=.git-blame-ignore-revs::The file lists no revisions. Delete it if it is no longer wanted."
            exit 1
          fi

          if [ "${status}" -ne 0 ]; then
            echo "Checked ${count} revision(s); see the errors above."
            exit 1
          fi

          echo "All ${count} revision(s) resolve and are reachable."

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: ga

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx', '.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore tools
        run: dotnet tool restore --configfile ${{ env.NUGET_CONFIG }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILTER_NON_WINDOWS }} --configfile ${{ env.NUGET_CONFIG }}

      # -Check runs the tools on a disposable copy of the tree, so this job cannot rewrite the checkout,
      # and prints the diff that would fix whatever it found.
      - name: Verify style, formatting and member ordering
        run: pwsh -NoProfile -NonInteractive -File scripts/tidy-code.ps1 -Scope all -Check

  # Cross-platform: build and test the shared Core, the source generator, and the Avalonia stack. These
  # projects target net8.0/net10.0 and build/test identically on Linux and Windows. The WPF projects are
  # Windows-only and are intentionally excluded here so Ubuntu never tries to build them.
  verify-avalonia:
    name: Verify Avalonia (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The 8.0 runtime executes the net8.0 test target of the multi-targeted Core tests.
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: ga

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx', '.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILTER_NON_WINDOWS }} --configfile ${{ env.NUGET_CONFIG }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILTER_NON_WINDOWS }} --configuration ${{ env.CONFIGURATION }} --no-restore /p:ContinuousIntegrationBuild=true

      # The solution filter is the source of truth for the cross-platform project set. dotnet test
      # discovers its test projects and runs every target framework automatically.
      #
      # VSTestResultsDirectory rather than --results-directory: MSBuild expands it per project, so each
      # project and each target framework writes into its own folder. With one shared directory the
      # reports collide - two suites both produce a net10.0 report, and VSTest resolves that by appending
      # "[1]" to whichever arrives second, which is not an identity anyone can read.
      - name: Test
        shell: bash
        run: dotnet test ${{ env.SOLUTION_FILTER_NON_WINDOWS }} --configuration ${{ env.CONFIGURATION }} --no-build --logger GitHubActions --logger trx --collect:"XPlat Code Coverage" -p:VSTestResultsDirectory='${{ github.workspace }}/${{ env.TEST_RESULTS }}/$(MSBuildProjectName)/$(TargetFramework)'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: avalonia-${{ matrix.os }}
          # Fork PRs may not receive CODECOV_TOKEN; protected main pushes must surface upload failures.
          fail_ci_if_error: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-avalonia-${{ matrix.os }}
          path: ${{ env.TEST_RESULTS }}
          if-no-files-found: warn
          retention-days: 14

  # Windows-only: build and test the WPF stack (net10.0-windows, UseWPF). WPF is not available on Linux, so
  # this job runs on windows-latest only.
  verify-wpf:
    name: Verify WPF (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: ga

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx', '.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.WPF_TEST_PROJECT }} --configfile ${{ env.NUGET_CONFIG }}

      - name: Build
        run: dotnet build ${{ env.WPF_TEST_PROJECT }} --configuration ${{ env.CONFIGURATION }} --no-restore /p:ContinuousIntegrationBuild=true

      - name: Test
        shell: bash
        run: dotnet test ${{ env.WPF_TEST_PROJECT }} --configuration ${{ env.CONFIGURATION }} --no-build --logger GitHubActions --logger trx --collect:"XPlat Code Coverage" -p:VSTestResultsDirectory='${{ github.workspace }}/${{ env.TEST_RESULTS }}/$(MSBuildProjectName)/$(TargetFramework)'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: wpf-windows-latest
          fail_ci_if_error: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-wpf-windows-latest
          path: ${{ env.TEST_RESULTS }}
          if-no-files-found: warn
          retention-days: 14

  # Windows-only: build the whole solution (Avalonia + WPF), generate DocFX documentation for the runtime
  # assemblies, and pack every package. Runs on Windows because the WPF assemblies must build for both the
  # DocFX metadata and the WPF package.
  package-and-docs:
    name: Package and docs
    runs-on: windows-latest
    timeout-minutes: 30
    needs:
      - lint
      - verify-avalonia
      - verify-wpf
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: ga

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx', '.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore tools
        run: dotnet tool restore --configfile ${{ env.NUGET_CONFIG }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }} --configfile ${{ env.NUGET_CONFIG }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-restore /p:ContinuousIntegrationBuild=true

      - name: Build DocFX metadata
        run: dotnet tool run docfx metadata ${{ env.DOCFX_CONFIG }}

      # --warningsAsErrors: a docfx warning is a broken cross-reference or a file the configuration does
      # not reach, and both of those arrive on the published site as a hole.
      - name: Build DocFX site
        run: dotnet tool run docfx build ${{ env.DOCFX_CONFIG }} --warningsAsErrors

      # IsPackable in the project files is the source of truth for which projects ship as packages.
      # Package validation runs here, against the last published version.
      - name: Pack NuGet packages
        run: dotnet pack ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-build --output ${{ env.PACKAGE_OUTPUT }} /p:ContinuousIntegrationBuild=true

      - name: Determine packed version
        id: version
        shell: bash
        run: |
          nupkg="$(ls "${PACKAGE_OUTPUT}"/ResXLocalization.Avalonia.*.nupkg)"
          version="$(basename "${nupkg}" .nupkg | sed 's/^ResXLocalization\.Avalonia\.//')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Packed version ${version}"

      # An ordinary artifact rather than the Pages artifact: deploy-docs adds the benchmark results to the
      # site before it builds the Pages artifact. Only deploy-docs (pushes to main) consumes it.
      - name: Upload documentation site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-site
          path: ${{ env.DOCS_SITE }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: |
            ${{ env.PACKAGE_OUTPUT }}/*.nupkg
            ${{ env.PACKAGE_OUTPUT }}/*.snupkg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Decides whether the benchmarks run: only when something they measure, or how they are run, changed, so a
  # documentation-only pull request is not held up by them. A skipped job counts as passed for a required
  # check. Without a previous commit to compare with - a new branch, a tag, a manual run - they run.
  benchmark-changes:
    name: Detect benchmark changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changes.outputs.run }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compare the changed files
        id: changes
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2> /dev/null; then
            echo "No previous commit to compare with; the benchmarks run."
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          pattern='^(src/|benchmarks/|build/|Directory\.[^/]+$|global\.json$|\.github/workflows/ci\.yml$|scripts/convert-benchmark-results\.ps1$)'

          if git diff --name-only "${BASE}" HEAD | grep -qE "${pattern}"; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Nothing the benchmarks measure changed; they are skipped."
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi

  # One suite per entry, in parallel with the build jobs, all on one runner type so that the history stays
  # comparable. Every benchmark class writes its own report, so each table's Ratio column is against that
  # class's baseline; --join would merge a suite's classes into one table with one baseline. The suites check
  # their own results before measuring and exit non-zero when a benchmark fails or none ran, so a broken
  # benchmark fails here instead of missing from the report.
  benchmarks:
    name: Benchmarks (${{ matrix.suite }})
    runs-on: windows-latest
    timeout-minutes: 15
    needs: benchmark-changes
    if: needs.benchmark-changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite:
          - Core
          - Avalonia
          - WPF
    env:
      BENCHMARK_PROJECT: benchmarks/ResXLocalization.${{ matrix.suite }}.Benchmarks/ResXLocalization.${{ matrix.suite }}.Benchmarks.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx', '.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.BENCHMARK_PROJECT }} --configfile ${{ env.NUGET_CONFIG }}

      - name: Build
        run: dotnet build ${{ env.BENCHMARK_PROJECT }} --configuration ${{ env.CONFIGURATION }} --no-restore /p:ContinuousIntegrationBuild=true

      - name: Run benchmarks
        run: dotnet run --project ${{ env.BENCHMARK_PROJECT }} --configuration ${{ env.CONFIGURATION }} --no-build -- --filter "*"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results-${{ matrix.suite }}
          path: ${{ env.BENCHMARK_REPORTS }}/ResXLocalization.${{ matrix.suite }}.Benchmarks/
          if-no-files-found: error
          retention-days: 30

  # Compares the results with the latest results from main and reports both series in the job summary: a time
  # above 150% is an alert, an allocation above 125% fails a pull request - unless a maintainer accepted the
  # increase with the label accept-allocation-increase. On main the results are appended to the history on the
  # benchmark-data branch, with this run's reports under latest/, which deploy-docs publishes. Only this job
  # can write.
  benchmark-report:
    name: Benchmark report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: benchmarks
    permissions:
      contents: write
      pull-requests: write
    env:
      BENCHMARK_SERIES: artifacts/benchmarks/series
      # A fork's token cannot comment, so only a pull request from this repository comments on an alert; the
      # job summary has the comparison either way.
      COMMENT_ON_ALERT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      IS_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: benchmark-results-*
          path: ${{ env.BENCHMARK_REPORTS }}

      - name: Merge benchmark results
        run: pwsh -NoProfile -NonInteractive -File scripts/convert-benchmark-results.ps1 -ReportDirectory ${{ env.BENCHMARK_REPORTS }} -OutputDirectory ${{ env.BENCHMARK_SERIES }}

      # The action needs the data branch to exist. The first push to main creates it, with one commit and no
      # results; a pull request before that has nothing to compare with.
      - name: Find the benchmark data branch
        id: data-branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads origin "${BENCHMARK_DATA_BRANCH}" > /dev/null; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          elif [ "${IS_MAIN}" = "true" ]; then
            tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/trees" -f 'tree[][path]=README.md' -f 'tree[][mode]=100644' -f 'tree[][type]=blob' -f 'tree[][content]=Benchmark results of main, written by CI. This branch holds no code and is never merged.' --jq .sha)"
            commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits" -f message="Create the benchmark data branch" -f tree="${tree}" --jq .sha)"
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${BENCHMARK_DATA_BRANCH}" -f sha="${commit}" > /dev/null
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice title=No benchmark baseline::main has no benchmark results yet, so there is nothing to compare with."
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Compare times
        if: steps.data-branch.outputs.exists == 'true'
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Time
          tool: benchmarkdotnet
          output-file-path: ${{ env.BENCHMARK_SERIES }}/times.json
          gh-pages-branch: ${{ env.BENCHMARK_DATA_BRANCH }}
          benchmark-data-dir-path: history
          github-token: ${{ github.token }}
          auto-push: false
          alert-threshold: "150%"
          fail-on-alert: false
          comment-on-alert: ${{ env.COMMENT_ON_ALERT }}
          summary-always: true
          max-items-in-chart: 200

      # skip-fetch-gh-pages: the step above fetched the branch and committed to it locally, and fetching it
      # again would be refused as a non-fast-forward update. Only a pull request fails on an alert: on main the
      # increase was reviewed, and the new values become the baseline.
      - name: Compare allocations
        if: steps.data-branch.outputs.exists == 'true'
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Allocations
          tool: customSmallerIsBetter
          output-file-path: ${{ env.BENCHMARK_SERIES }}/allocations.json
          gh-pages-branch: ${{ env.BENCHMARK_DATA_BRANCH }}
          benchmark-data-dir-path: history
          github-token: ${{ github.token }}
          auto-push: false
          skip-fetch-gh-pages: true
          alert-threshold: "125%"
          fail-on-alert: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'accept-allocation-increase') }}
          comment-on-alert: ${{ env.COMMENT_ON_ALERT }}
          summary-always: true
          max-items-in-chart: 200

      # Each of the two steps above committed to the local data branch. Squash them, add this run's HTML and
      # markdown reports under latest/ (one per benchmark class) with an index page, and push one commit.
      - name: Publish to the benchmark data branch
        if: env.IS_MAIN == 'true' && steps.data-branch.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reports="$(mktemp -d)"
          links=""
          for suite in Core Avalonia WPF; do
            for html in "${BENCHMARK_REPORTS}/benchmark-results-${suite}/results"/*-report.html; do
              report="$(basename "${html}" -report.html)"
              cp "${html}" "${reports}/${report}.html"
              cp "${html%.html}-github.md" "${reports}/${report}.md"
              links="${links}<li>${suite}: <a href=\"${report}.html\">${report##*.}</a> (<a href=\"${report}.md\">markdown</a>)</li>"
            done
          done

          {
            echo '<!doctype html>'
            echo '<html lang="en">'
            echo '<head><meta charset="utf-8"><title>ResXLocalization benchmark results</title></head>'
            echo '<body>'
            echo '<h1>ResXLocalization benchmark results</h1>'
            echo "<p>Commit ${GITHUB_SHA}. Each report starts with the hardware and runtime it was measured on.</p>"
            echo '<ul>'
            echo "${links}"
            echo '</ul>'
            echo '<p><a href="../history/">History of every benchmark on main</a></p>'
            echo '</body>'
            echo '</html>'
          } > "${reports}/index.html"

          git switch "${BENCHMARK_DATA_BRANCH}"
          git reset --soft HEAD~2
          rm -rf latest
          mkdir latest
          cp "${reports}"/* latest/
          git add history latest
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "Benchmark results for ${GITHUB_SHA}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${BENCHMARK_DATA_BRANCH}"

  # Prove the source generator's Roslyn floor forever: consume the packed packages with ONLY the .NET 8
  # SDK. A generator compiled against a newer Roslyn than the .NET 8 compiler would emit CS9057, skip
  # generation, and fail the consumer build on the missing …Keys types.
  verify-net8-consumers:
    name: Consume packages on .NET 8 SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: package-and-docs
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET 8 SDK only
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
          dotnet-quality: ga

      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nuget-packages
          path: ${{ env.PACKAGE_OUTPUT }}

      # The pin covers the consumer subtree only, and every step below runs from there: `dotnet` resolves
      # global.json from the current directory upward, so a command run from the repository root would
      # pick up the root global.json instead and prove nothing.
      - name: Pin the .NET 8 SDK for the consumers (CI only, not committed)
        shell: bash
        run: |
          cat > "${CONSUMER_DIRECTORY}/global.json" <<'JSON'
          {
            "sdk": {
              "version": "8.0.100",
              "rollForward": "latestFeature"
            }
          }
          JSON

      - name: Assert the active SDK is 8.0
        shell: bash
        working-directory: ${{ env.CONSUMER_DIRECTORY }}
        run: |
          version="$(dotnet --version)"
          echo "Active SDK: ${version}"
          case "${version}" in
            8.*) ;;
            *) echo "::error title=Wrong SDK::Expected an 8.0 SDK, got ${version}."; exit 1 ;;
          esac

      # -p:TargetFrameworks=net8.0 as well as --framework: `dotnet run --framework` still EVALUATES every
      # entry in TargetFrameworks during restore, and an 8.0 SDK cannot evaluate net10.0 (NETSDK1045).
      - name: Run Avalonia package consumer (net8.0 SDK)
        working-directory: ${{ env.CONSUMER_DIRECTORY }}
        run: dotnet run --project AvaloniaConsumer/AvaloniaConsumer.csproj --framework net8.0 -p:TargetFrameworks=net8.0 --configuration ${{ env.CONFIGURATION }} -p:ResXLocalizationVersion=${{ needs.package-and-docs.outputs.version }}

      - name: Run MessageFormat package consumer (net8.0 SDK)
        working-directory: ${{ env.CONSUMER_DIRECTORY }}
        run: dotnet run --project MessageFormatConsumer/MessageFormatConsumer.csproj --framework net8.0 -p:TargetFrameworks=net8.0 --configuration ${{ env.CONFIGURATION }} -p:ResXLocalizationVersion=${{ needs.package-and-docs.outputs.version }}

      - name: Run WPF package consumer (net8.0 SDK)
        if: runner.os == 'Windows'
        working-directory: ${{ env.CONSUMER_DIRECTORY }}
        run: dotnet run --project WpfConsumer/WpfConsumer.csproj --configuration ${{ env.CONFIGURATION }} -p:ResXLocalizationVersion=${{ needs.package-and-docs.outputs.version }}

      # RootNamespace derived from the project name, which WPF's temporary markup-compile pass gets wrong;
      # see the comment "WPF's temporary markup-compile pass" in build/ResXLocalization.Resx.targets.
      - name: Run WPF package consumer with a derived RootNamespace (net8.0 SDK)
        if: runner.os == 'Windows'
        working-directory: ${{ env.CONSUMER_DIRECTORY }}
        run: dotnet run --project WpfDerivedNamespaceConsumer/WpfDerivedNamespaceConsumer.csproj --configuration ${{ env.CONFIGURATION }} -p:ResXLocalizationVersion=${{ needs.package-and-docs.outputs.version }}

      - name: Run combined Avalonia and WPF package consumer (net8.0 SDK)
        if: runner.os == 'Windows'
        working-directory: ${{ env.CONSUMER_DIRECTORY }}
        run: dotnet run --project CombinedConsumer/CombinedConsumer.csproj --configuration ${{ env.CONFIGURATION }} -p:ResXLocalizationVersion=${{ needs.package-and-docs.outputs.version }}

      # The pin is a CI-only file. Removing it keeps a reused workspace from carrying an 8.0 SDK
      # selection into whatever runs there next.
      - name: Remove the temporary SDK pin
        if: always()
        shell: bash
        run: rm -f "${CONSUMER_DIRECTORY}/global.json"

  # The packed-package Native AOT gate. It publishes AvaloniaConsumer and MessageFormatConsumer with
  # PublishAot, requires zero IL2xxx/IL3xxx diagnostics, and RUNS each native binary - a file that exists
  # proves nothing, because everything trimming can break (a satellite that is no longer loaded, a
  # resource name that no longer resolves) produces a binary that starts and answers wrongly.
  #
  # Three runs. The trimming behaviour under test belongs to the ILC compiler and does not vary by host,
  # so net8.0 - the LTS floor the packages promise - is exercised on Linux, and net10.0 on both.
  verify-package-aot:
    name: Verify packed-package Native AOT (${{ matrix.framework }}, ${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: package-and-docs
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            framework: net8.0
          - os: ubuntu-latest
            runtime: linux-x64
            framework: net10.0
          - os: windows-latest
            runtime: win-x64
            framework: net10.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The 8.0 runtime is what the build-time tooling of the net8.0 run runs on.
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: ga

      # ILC links the native image with the platform toolchain. Without these the link step fails with a
      # message about a missing linker rather than about a missing prerequisite.
      - name: Provision the Linux native toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev

      - name: Verify the Windows native toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'

          if (-not (Test-Path -LiteralPath $vswhere))
          {
              Write-Output "::error title=Missing toolchain::vswhere.exe was not found at $vswhere. The Native AOT link step needs it and fails with MSB3073 without it."
              exit 1
          }

          $installation = & $vswhere -latest -products '*' -property installationPath `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64

          if (-not $installation)
          {
              Write-Output '::error title=Missing toolchain::No Visual Studio installation with the MSVC x64 C++ tools was found.'
              exit 1
          }

          Write-Output "MSVC toolchain: $installation"

          $windowsSdk = Get-ChildItem -Path 'C:/Program Files (x86)/Windows Kits/10/Lib' -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name |
              Select-Object -Last 1

          if (-not $windowsSdk)
          {
              Write-Output '::error title=Missing Windows SDK::No Windows SDK was found under Windows Kits/10/Lib; the native link step needs its import libraries.'
              exit 1
          }

          Write-Output "Windows SDK: $($windowsSdk.Name)"

      - name: Download exact packages to be published
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nuget-packages
          path: ${{ env.PACKAGE_OUTPUT }}

      # The script is the gate, not this job: it validates the artifact set from each nuspec, isolates the
      # consumer package cache, then publishes both consumers, requires zero IL diagnostics, and runs each
      # binary.
      - name: Native AOT gate
        run: pwsh -NoProfile -NonInteractive -File scripts/verify-package-aot.ps1 -Framework ${{ matrix.framework }} -Runtime ${{ matrix.runtime }} -PackageVersion ${{ needs.package-and-docs.outputs.version }} -Configuration ${{ env.CONFIGURATION }}

      - name: Upload the Native AOT logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-aot-logs-${{ matrix.framework }}-${{ matrix.runtime }}
          path: ${{ env.AOT_OUTPUT }}/logs
          if-no-files-found: warn
          retention-days: 14

  # Publish the DocFX site to GitHub Pages on every push to main (requires Pages to be set to
  # "GitHub Actions" as the source in the repository settings), with the benchmark-data branch under
  # benchmarks/. It waits for benchmark-report without depending on it: when the benchmarks fail or are
  # skipped, the site is deployed with the last results the branch has.
  deploy-docs:
    name: Deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - package-and-docs
      - benchmark-report
    if: always() && needs.package-and-docs.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download documentation site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-site
          path: ${{ env.DOCS_SITE }}

      - name: Find the benchmark data branch
        id: data-branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "${BENCHMARK_DATA_BRANCH}" > /dev/null; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Add the benchmark results
        if: steps.data-branch.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BENCHMARK_DATA_BRANCH }}
          path: ${{ env.DOCS_SITE }}/benchmarks
          persist-credentials: false

      - name: Remove the checkout metadata
        if: steps.data-branch.outputs.exists == 'true'
        shell: bash
        run: rm -rf "${DOCS_SITE}/benchmarks/.git"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ env.DOCS_SITE }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # Publishing is deliberate, not automatic: it runs only when a version tag (v1.2.3) is pushed, never on
  # regular pushes to main.
  #
  # Nothing reaches NuGet.org that has not been built, tested, validated on pack, published natively and
  # installed as a package first: the needs below name every one of those jobs, so a green publish cannot
  # be reached by any path that skipped one.
  publish-nuget:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - verify-avalonia
      - verify-wpf
      - package-and-docs
      - verify-package-aot
      - verify-net8-consumers
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: nuget
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      NUGET_USER: ${{ secrets.NUGET_USER }}

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nuget-packages
          path: ${{ env.PACKAGE_OUTPUT }}

      - name: Validate release changelog before publication
        shell: pwsh
        run: ./${{ env.RELEASE_NOTES_SCRIPT }} -Version "$($env:GITHUB_REF_NAME -replace '^v', '')"

      - name: Verify the tag matches the packed version
        shell: bash
        # The Version property in Directory.Build.props is the single source of truth; tagging a
        # different version would otherwise publish stale packages (or silently publish nothing,
        # thanks to --skip-duplicate). The expected set is named here as well, so a pack that produced
        # fewer packages than it should cannot reach NuGet.org.
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          status=0
          for id in ResXLocalization.Core ResXLocalization.Avalonia ResXLocalization.MessageFormat ResXLocalization.WPF; do
            if [[ ! -f "${PACKAGE_OUTPUT}/${id}.${tag_version}.nupkg" ]]; then
              echo "::error title=Tag/version mismatch::Tag ${GITHUB_REF_NAME} expects ${id}.${tag_version}.nupkg, but the build produced:"
              ls -1 "${PACKAGE_OUTPUT}"
              status=1
            fi
          done
          exit "${status}"

      - name: Select publish mode
        id: publish-mode
        shell: bash
        run: |
          if [[ -n "${NUGET_USER}" ]]; then
            echo "mode=trusted" >> "${GITHUB_OUTPUT}"
          elif [[ -n "${NUGET_API_KEY}" ]]; then
            echo "mode=api-key" >> "${GITHUB_OUTPUT}"
          else
            echo "::error title=NuGet credentials missing::Configure Trusted Publishing with NUGET_USER or add NUGET_API_KEY."
            exit 1
          fi

      - name: NuGet login
        id: nuget-login
        if: steps.publish-mode.outputs.mode == 'trusted'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ env.NUGET_USER }}

      - name: Publish packages with Trusted Publishing
        if: steps.publish-mode.outputs.mode == 'trusted'
        run: dotnet nuget push "${{ env.PACKAGE_OUTPUT }}/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source nuget.org --skip-duplicate

      - name: Publish packages with API key
        if: steps.publish-mode.outputs.mode == 'api-key'
        run: dotnet nuget push "${{ env.PACKAGE_OUTPUT }}/*.nupkg" --api-key "${{ env.NUGET_API_KEY }}" --source nuget.org --skip-duplicate

  # Turn the tag into a GitHub Release: the matching CHANGELOG section becomes the notes and the
  # packages are attached, so a release is browsable without leaving GitHub.
  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish-nuget
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nuget-packages
          path: ${{ env.PACKAGE_OUTPUT }}

      - name: Extract the changelog section for this version
        shell: pwsh
        run: ./${{ env.RELEASE_NOTES_SCRIPT }} -Version "$($env:GITHUB_REF_NAME -replace '^v', '')"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "ResXLocalization ${GITHUB_REF_NAME}" \
            --notes-file "${RELEASE_NOTES_FILE}" \
            --verify-tag \
            "${PACKAGE_OUTPUT}"/*.nupkg "${PACKAGE_OUTPUT}"/*.snupkg
